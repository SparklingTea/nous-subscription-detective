# How the top UK consumer subscriptions are actually cancelled.
#
# method: online | online_2fa | app_store | in_app | chat | phone | email
# automatable: yes | with_handoff (agent can do it but needs a member-supplied code or consent) | no
# confidence: how sure the desk research is. Flows change often: anything below "high" should be
#   re-walked by hand (or by the browser agent in record mode) before an agent runs it on a member's behalf.
#
# Cross-cutting rule: the *billing channel* decides the route, not the brand. Netflix billed through
# APPLE.COM/BILL is cancelled at Apple; Spotify billed through PAYPAL can also be stopped in PayPal's
# automatic-payments page. The detector records channel per stream for exactly this reason.

netflix:
  name: Netflix
  method: online
  route: netflix.com > Account > Cancel membership > Finish cancellation
  notice: none; access runs to end of billing period
  dark_patterns: []
  gotchas: ["If billed via Apple, Google, Sky or Virgin, cancel with that partner instead"]
  automatable: "yes"
  automation: browser agent; login may trigger an emailed sign-in code
  confidence: high

amazon_prime:
  name: Amazon Prime
  method: online
  route: amazon.co.uk > Account > Prime membership > Manage > End membership > several confirmation pages
  notice: none; unused memberships may be eligible for a refund
  dark_patterns: ["multi-page retention flow", "Keep my benefits styled as the primary button", "benefit-loss reminders", "remind-me-later decoy"]
  gotchas: ["Prime Video Channels are separate subscriptions and need cancelling on their own"]
  automatable: "yes"
  automation: browser agent that must pick "continue to cancel" over styled retention buttons (see mock flow)
  confidence: high

