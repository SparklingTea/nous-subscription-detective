# Fallbacks that work regardless of merchant.
_fallbacks:
  card_cpa:
    name: Stop a recurring card payment at the bank
    note: >
      Under the Payment Services Regulations a cardholder can withdraw consent for a continuous payment
      authority by telling their bank or card issuer; the bank must stop future payments. This stops the
      money, not the contract, so it is a backstop for merchants that make cancelling hard, not a first resort.
  direct_debit:
    name: Cancel a Direct Debit
    note: >
      Cancelling a mandate at the bank stops collection but does not end the contract; the member may still owe.
      Use for clearly ended services (gym already cancelled, still collecting) and pair with the Direct Debit Guarantee
      for refunds of wrong collections.
  paypal:
    name: PayPal automatic payments
    note: PayPal > Settings > Payments > Manage automatic payments > Cancel. Works for PAYPAL * descriptors.
